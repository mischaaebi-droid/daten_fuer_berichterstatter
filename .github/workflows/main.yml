name: Bundesgericht Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python-Pakete installieren
        run: |
          pip install playwright beautifulsoup4 lxml pandas openpyxl
          playwright install chromium




      - name: Bundesgericht seit 1. Januar 2026 scrapen
        run:  |
            start="2026-01-01"
            end="$(date +%Y-%m-%d)"
        
            current="$start"
        
            while [ "$current" != "$(date -I -d "$end + 1 day")" ]; do
              datum=$(date -d "$current" +%Y%m%d)
        
              echo "========================================"
              echo "Scrape Bundesgericht: $datum"
              echo "========================================"
        
              python bundesgericht_tagesurteile.py --date "$datum"
        
              current=$(date -I -d "$current + 1 day")
            done
       

      - name: JSON auf GitHub speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/decisions-*.json
          git commit -m "Bundesgerichtsdaten aktualisieren" || exit 0
          git push
