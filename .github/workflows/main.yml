name: Bundesgericht Scraper

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Datum zum Nachholen (YYYYMMDD), leer = letzte fünf Tage'
        required: false
        type: string
  schedule:
    - cron: '10 18 * * *'
      timezone: 'Europe/Zurich'

permissions:
  contents: write

concurrency:
  group: bundesgericht-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python-Pakete installieren
        run: pip install playwright beautifulsoup4 lxml pandas openpyxl

      - name: Chromium installieren
        run: python -m playwright install --with-deps chromium

      - name: Bundesgericht scrapen und analysieren
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python bundesgericht_tagesurteile_new.py --date "${{ inputs.date }}"
          else
            python bundesgericht_tagesurteile_new.py
          fi

      - name: JSON auf GitHub speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet && exit 0
          git commit -m "Bundesgerichtsdaten aktualisieren"
          git pull --rebase --autostash
          git push
